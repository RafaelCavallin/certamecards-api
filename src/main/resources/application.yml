spring:
  application:
    name: certamecards-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:certamecards}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        create_empty_composites:
          enabled: true
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

certame:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-token-ttl: 15m
  client:
    frontend-origin: ${CERTAME_FRONTEND_ORIGIN:https://certamecards.localhost}
    client-header-value: web
  refresh-cookie:
    name: __Host-certame_rt
    ttl: 90d
    secure: true
  one-time-token:
    confirm-email-ttl: 24h
    reset-password-ttl: 1h
    link-google-ttl: 10m
    reauth-ttl: 5m
  login-throttle:
    max-failures: 5
    lock-window: 15m
  register-rate-limit:
    max-requests: 10
    window: 1m
  terms:
    current-version: "2026-09-01"
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  mail:
    from-address: naoresponda@certamecards.com.br
    from-name: CertameCards
  cookie-encryption:
    key: ${COOKIE_ENCRYPTION_KEY}
  library:
    progress-retention-days: 90
    preview-cards: 10
    min-cards-to-publish: 5
    page-size: 20
    content-page-size: 500
    suggestions: 3
  official:
    content-update-batch: 500
    content-update-interval: 1s
  sync:
    default-page-limit: 500
    max-batch-operations: 100
    max-depends-on: 10
    conflict-retention-days: 30

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      console: ecs
